<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" width="480" height="460">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,700&amp;family=DM+Sans:wght@500;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap');
    .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
    .sans  { font-family: 'DM Sans', Arial, sans-serif; }
    .mono  { font-family: 'JetBrains Mono', 'Courier New', monospace; }
  </style>

  <!-- ============ POKER CHIP ============ -->
  <g>
    <!-- chip ring -->
    <circle cx="240" cy="150" r="112" fill="none" stroke="#D7263D" stroke-width="16"/>
    <!-- edge spots -->
    <g fill="#EFE7D2">
      <rect x="224" y="29"  width="32" height="18" rx="2" transform="rotate(0 240 150)"/>
      <rect x="224" y="29"  width="32" height="18" rx="2" transform="rotate(45 240 150)"/>
      <rect x="224" y="29"  width="32" height="18" rx="2" transform="rotate(90 240 150)"/>
      <rect x="224" y="29"  width="32" height="18" rx="2" transform="rotate(135 240 150)"/>
      <rect x="224" y="29"  width="32" height="18" rx="2" transform="rotate(180 240 150)"/>
      <rect x="224" y="29"  width="32" height="18" rx="2" transform="rotate(225 240 150)"/>
      <rect x="224" y="29"  width="32" height="18" rx="2" transform="rotate(270 240 150)"/>
      <rect x="224" y="29"  width="32" height="18" rx="2" transform="rotate(315 240 150)"/>
    </g>
    <!-- inner detail rings -->
    <circle cx="240" cy="150" r="96" fill="none" stroke="#EFE7D2" stroke-width="1.5" opacity="0.45"/>
    <circle cx="240" cy="150" r="88" fill="none" stroke="#C9A227" stroke-width="1.6" stroke-dasharray="4 7" opacity="0.9"/>
  </g>

  <!-- ============ TILTED TOP HAT ============ -->
  <g transform="rotate(-12 240 150)">
    <!-- brim -->
    <ellipse cx="240" cy="182" rx="58" ry="10" fill="#14171F" stroke="#EFE7D2" stroke-width="3"/>
    <!-- crown -->
    <path d="M 210,182 L 210,106 Q 210,98 218,98 L 262,98 Q 270,98 270,106 L 270,182 Z"
          fill="#14171F" stroke="#EFE7D2" stroke-width="3" stroke-linejoin="round"/>
    <!-- hat band -->
    <rect x="211.5" y="158" width="57" height="16" fill="#C9A227"/>
    <rect x="234" y="158" width="6" height="16" fill="#EFE7D2"/>
  </g>

  <!-- ============ MONOCLE ============ -->
  <g>
    <path d="M 258,190 Q 272,194 276,204" fill="none" stroke="#C9A227" stroke-width="2" stroke-dasharray="1.5 4" stroke-linecap="round"/>
    <circle cx="278" cy="215" r="12" fill="none" stroke="#C9A227" stroke-width="3"/>
    <path d="M 272,210 L 280,217" stroke="#EFE7D2" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
  </g>

  <!-- ============ WORDMARK ============ -->
  <text x="240" y="322" text-anchor="middle" class="sans" font-size="17" font-weight="700"
        letter-spacing="10" fill="#C9A227">THE</text>
  <text x="240" y="372" text-anchor="middle" class="serif" font-size="47" font-weight="700"
        letter-spacing="2" fill="#EFE7D2"><tspan font-style="italic">TILTED</tspan> GENT</text>
  <text x="240" y="408" text-anchor="middle" class="mono" font-size="11.5" font-weight="500"
        letter-spacing="4.5" fill="#8A8F9C">MARKETS &#183; ODDS &#183; RISK</text>
</svg>
