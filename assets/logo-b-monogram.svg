<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=swap');
    .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
  </style>

  <!-- chip ring -->
  <circle cx="130" cy="130" r="100" fill="none" stroke="#D7263D" stroke-width="14"/>

  <!-- plain edge spots on diagonals -->
  <g fill="#EFE7D2">
    <rect x="116" y="22" width="28" height="16" rx="2" transform="rotate(45 130 130)"/>
    <rect x="116" y="22" width="28" height="16" rx="2" transform="rotate(135 130 130)"/>
    <rect x="116" y="22" width="28" height="16" rx="2" transform="rotate(225 130 130)"/>
    <rect x="116" y="22" width="28" height="16" rx="2" transform="rotate(315 130 130)"/>
  </g>

  <!-- card-suit pips at N / E / S / W, sitting on the ring -->
  <!-- spade (N) -->
  <g transform="translate(130,30)" fill="#EFE7D2">
    <path d="M0,-9 C5.5,-2.5 9,0 9,3.6 C9,8 3.6,9 1.4,6.3 C2.2,9 3.6,10.8 5.4,11.7 L-5.4,11.7 C-3.6,10.8 -2.2,9 -1.4,6.3 C-3.6,9 -9,8 -9,3.6 C-9,0 -5.5,-2.5 0,-9 Z"/>
  </g>
  <!-- heart (E) -->
  <g transform="translate(230,130)" fill="#EFE7D2">
    <path d="M0,10 C-9,3 -10,-2 -6.3,-5.4 C-3.6,-7.6 0,-6 0,-2.7 C0,-6 3.6,-7.6 6.3,-5.4 C10,-2 9,3 0,10 Z"/>
  </g>
  <!-- club (S) -->
  <g transform="translate(130,230)" fill="#EFE7D2">
    <circle cx="0" cy="-5" r="4.6"/>
    <circle cx="-5" cy="1.8" r="4.6"/>
    <circle cx="5" cy="1.8" r="4.6"/>
    <path d="M-1.4,3.6 C-0.9,7.2 -2.7,9.9 -4.5,11.7 L4.5,11.7 C2.7,9.9 0.9,7.2 1.4,3.6 Z"/>
  </g>
  <!-- diamond (W) -->
  <g transform="translate(30,130)" fill="#EFE7D2">
    <path d="M0,-10 L6.3,0 L0,10 L-6.3,0 Z"/>
  </g>

  <!-- inner ring -->
  <circle cx="130" cy="130" r="76" fill="none" stroke="#C9A227" stroke-width="1.6" stroke-dasharray="4 7" opacity="0.9"/>

  <!-- TG monogram: tilted T, upright G -->
  <text x="103" y="167" text-anchor="middle" class="serif" font-size="98" font-weight="700"
        fill="#EFE7D2" transform="rotate(-12 103 135)">T</text>
  <text x="166" y="167" text-anchor="middle" class="serif" font-size="98" font-weight="700"
        fill="#C9A227">G</text>
</svg>
