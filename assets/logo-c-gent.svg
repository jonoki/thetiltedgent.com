<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" width="480" height="470">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,700&amp;family=DM+Sans:wght@500;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap');
    .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
    .sans  { font-family: 'DM Sans', Arial, sans-serif; }
    .mono  { font-family: 'JetBrains Mono', 'Courier New', monospace; }
  </style>

  <!-- ============ THE GENT: tilted topper + shades + bow tie ============ -->

  <!-- tilted top hat -->
  <g transform="rotate(-12 240 105)">
    <ellipse cx="240" cy="133" rx="64" ry="10.5" fill="#14171F" stroke="#EFE7D2" stroke-width="3.2"/>
    <path d="M 206,133 L 206,56 Q 206,48 214,48 L 266,48 Q 274,48 274,56 L 274,133 Z"
          fill="#14171F" stroke="#EFE7D2" stroke-width="3.2" stroke-linejoin="round"/>
    <rect x="207.6" y="108" width="64.8" height="17" fill="#D7263D"/>
    <rect x="233" y="108" width="6" height="17" fill="#C9A227"/>
  </g>

  <!-- aviator shades -->
  <g>
    <!-- temples -->
    <path d="M 178,196 L 156,188" stroke="#C9A227" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M 302,196 L 324,188" stroke="#C9A227" stroke-width="3.4" stroke-linecap="round"/>
    <!-- bridge -->
    <path d="M 232,193 Q 240,184 248,193" fill="none" stroke="#C9A227" stroke-width="3.4"/>
    <!-- lenses -->
    <path d="M 178,186 Q 178,178 186,178 L 224,178 Q 232,178 232,186 L 231,204 Q 229,222 209,222 Q 186,222 180,204 Z"
          fill="#1B1E26" stroke="#C9A227" stroke-width="3.2"/>
    <path d="M 248,186 Q 248,178 256,178 L 294,178 Q 302,178 302,186 L 300,204 Q 294,222 271,222 Q 251,222 249,204 Z"
          fill="#1B1E26" stroke="#C9A227" stroke-width="3.2"/>
    <!-- red table-light glints -->
    <path d="M 190,186 L 206,212" stroke="#D7263D" stroke-width="3.5" opacity="0.75" stroke-linecap="round"/>
    <path d="M 260,186 L 276,212" stroke="#D7263D" stroke-width="3.5" opacity="0.75" stroke-linecap="round"/>
  </g>

  <!-- bow tie -->
  <g>
    <path d="M 233,278 L 197,260 Q 188,278 197,296 Z" fill="#D7263D"/>
    <path d="M 247,278 L 283,260 Q 292,278 283,296 Z" fill="#D7263D"/>
    <rect x="228" y="266" width="24" height="24" rx="5" fill="#A31226"/>
  </g>

  <!-- ============ WORDMARK ============ -->
  <text x="240" y="352" text-anchor="middle" class="sans" font-size="17" font-weight="700"
        letter-spacing="10" fill="#C9A227">THE</text>
  <text x="240" y="402" text-anchor="middle" class="serif" font-size="47" font-weight="700"
        letter-spacing="2" fill="#EFE7D2"><tspan font-style="italic">TILTED</tspan> GENT</text>
  <text x="240" y="438" text-anchor="middle" class="mono" font-size="11.5" font-weight="500"
        letter-spacing="4.5" fill="#8A8F9C">MARKETS &#183; ODDS &#183; RISK</text>
</svg>
