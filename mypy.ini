; Type check for the Python build and check scripts:   py -3 -m mypy
; (mypy is not a dependency of the scripts; install it where you run the check: py -3 -m pip install mypy)
[mypy]
files = tools, tables/build_tables.py, tables/game_list.py, tables/tests
mypy_path = tools, tables, tools/tests
explicit_package_bases = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True

; build_chips imports fontTools lazily; it is optional and has no stubs
[mypy-fontTools.*]
ignore_missing_imports = True
