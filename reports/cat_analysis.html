<!-- ============ SECTION 01: COMPANY OVERVIEW ============ -->
<div class="section">
  <div class="section-title"><span class="num">01</span> Company Overview</div>
  <p class="prose">
    Caterpillar is the world's largest manufacturer of construction and mining equipment, and — increasingly — one of the largest suppliers of on-site electrical power generation on the planet. It sells excavators, dozers, wheel loaders, mining trucks, reciprocating engines, gas turbines and locomotives through a network of roughly 156 independent dealers serving nearly 190 countries, and finances a large share of those machines through its own captive lender, Cat Financial. FY2025 revenue was <strong>$67.6B</strong>, up 4.3% <span class="tip" title="Year-over-Year — compares a period to the same period one year earlier">YoY</span>, but that headline badly understates the current run-rate: trailing-twelve-month revenue is now <strong>$74.7B (+18.3%)</strong> and Q2 2026 was the first $20B quarter in company history. The company holds roughly <strong>15.2% of the $246.6B global construction-equipment market</strong> — nearly 40% more share than second-place Komatsu — and at a $393B market cap ranks around #37 globally, #28 among U.S.-listed companies, and roughly #12 on the NYSE.
  </p>
  <p class="prose" style="margin-top:14px;">
    The re-rating is the story. Two years ago Caterpillar was a late-cycle machinery stock trading near 15x earnings. Today it trades at 36.9x trailing earnings because the Power &amp; Energy segment — large reciprocating engines and turbines used for behind-the-meter data-center power — has turned a cyclical industrial into an AI-infrastructure supplier. Order backlog hit a record <strong>$72.1B in Q2 2026, up 92% YoY</strong>. Whether that multiple survives is the entire investment debate.
  </p>
  <div class="card-grid" style="margin-top:24px;">
    <div class="card">
      <div class="card-label">Chairman &amp; Chief Executive Officer</div>
      <div class="card-value" style="font-size:20px;">Joe Creed</div>
      <div class="card-note">CEO since May 1, 2025 (succeeding Jim Umpleby) and Chairman since April 1, 2026. A 1997 Caterpillar hire who ran Energy &amp; Transportation as group president and then served as COO — meaning the man now running the company built the segment driving the re-rating.</div>
    </div>
    <div class="card">
      <div class="card-label">Chief Financial Officer</div>
      <div class="card-value" style="font-size:20px;">Kyle Epley</div>
      <div class="card-note">CFO effective May 1, 2026, a near-three-decade Caterpillar veteran (ex-corporate controller, division CFO, SVP Global Finance Services). Predecessor Andrew Bonfield — CFO for eight years and architect of the current capital-allocation framework — stays in an advisory role until retiring Oct 1, 2026.</div>
    </div>
    <div class="card">
      <div class="card-label">Key Institutional Investors</div>
      <div class="card-value" style="font-size:20px;">BlackRock · State Street · Vanguard</div>

    </div>
  </div>
</div>

<!-- ============ SECTION 02: CORE BUSINESSES ============ -->
<div class="section">
  <div class="section-title"><span class="num">02</span> Core Businesses</div>
  <p class="prose">FY2025 segment sales and revenues (including inter-segment sales, which is how Caterpillar reports the segments; consolidated revenue of $67.6B is net of roughly $6.4B of eliminations). Note the shift: Power &amp; Energy — renamed from Energy &amp; Transportation — is now the largest segment by revenue <em>and</em> profit, and supplied all of 2025's growth while the two machine segments were flat-to-down.</p>
  <div class="seg-bar">
    <div style="flex:43;background:var(--accent);">Power &amp; Energy 43%</div>
    <div style="flex:34;background:#3b82f6;">Construction 34%</div>
    <div style="flex:17;background:var(--purple);">Resource 17%</div>
    <div style="flex:6;background:var(--amber);">6%</div>
  </div>

    <div class="seg-legend-item"><div class="seg-dot" style="background:#3b82f6;"></div>Construction Industries — $25.1B (~34%)</div>
    <div class="seg-legend-item"><div class="seg-dot" style="background:var(--purple);"></div>Resource Industries — $12.5B (~17%)</div>
    <div class="seg-legend-item"><div class="seg-dot" style="background:var(--amber);"></div>Financial Products — $4.2B (~6%)</div>
  </div>

  <!-- Power & Energy -->
  <div class="biz-card" style="border-left: 3px solid var(--accent); margin-top:24px;">
    <div class="biz-header">
      <div>
        <div class="biz-name">Power &amp; Energy (formerly Energy &amp; Transportation)</div>
        <span class="biz-badge dominant" style="margin-top:8px;">~20–25% OF LARGE GENSETS — THE RE-RATING ENGINE</span>
      </div>
      <div class="biz-stats">
        <div class="biz-stat"><div class="biz-stat-val">$32.2B</div><div class="biz-stat-label">FY25 Revenue</div></div>
        <div class="biz-stat"><div class="biz-stat-val">+11.6%</div><div class="biz-stat-label">FY25 YoY</div></div>
        <div class="biz-stat"><div class="biz-stat-val">~20–25%e</div><div class="biz-stat-label">Large Genset Share</div></div>
        <div class="biz-stat"><div class="biz-stat-val">~43%</div><div class="biz-stat-label">Revenue Mix</div></div>
      </div>
    </div>
    <div class="biz-desc">
      Reciprocating engines, gas turbines (Solar Turbines), generator sets, marine and rail. This is where the AI trade lives: in Q2 2026 the segment did <strong style="color:var(--text);">$8.24B of sales (+17% YoY)</strong> with <strong style="color:var(--text);">$2.03B of profit at a 24.6% margin</strong> (up 250 <span class="tip" title="Basis points — one basis point equals 0.01 percentage point">bps</span>), and power generation sales-to-users grew <strong style="color:var(--text);">72%</strong> on "very strong demand for large gen sets and turbines used in data center applications." Backlog for large reciprocating engines is up more than 3.5x since January 2024, six separate customer agreements each cover at least 1 gigawatt of capacity, and management says some customers are ordering as far out as 2030. Caterpillar is restarting its 10-megawatt medium-speed gas reciprocating platform (idled since 2022) to add 1.5 GW of capacity with first shipments in Q4 2026, on top of a plan to roughly <strong style="color:var(--text);">triple large-engine capacity versus 2024</strong> with heavy investment across 2027–2029 and cash payback targeted by end-2030. Highest-margin segment in the portfolio; also the one carrying the most valuation expectation.
    </div>
    <div class="biz-tam"><strong>Industry Size:</strong> Global generator sets ~$27B growing ~8%/yr; the broader data-center power equipment pool (gensets, turbines, switchgear, BTM generation) is $80B+ and compounding at double digits as U.S. electricity demand rises for the first time in two decades</div>
    <div class="comp-bubbles">
      <div class="comp-bubble"><div class="comp-bubble-name">Cummins (Power Systems)</div><div class="comp-bubble-stats"><div><div class="comp-bubble-val">~15%e</div><div class="comp-bubble-label">Genset Share</div></div><div><div class="comp-bubble-val">$2.3B/qtr</div><div class="comp-bubble-label">Q2'26 Revenue</div></div><div><div class="comp-bubble-val">+19%</div><div class="comp-bubble-label">Rev YoY</div></div></div></div>
      <div class="comp-bubble"><div class="comp-bubble-name">GE Vernova</div><div class="comp-bubble-stats"><div><div class="comp-bubble-val">116 GW</div><div class="comp-bubble-label">Turbine Backlog</div></div><div><div class="comp-bubble-val">$11.1B/qtr</div><div class="comp-bubble-label">Q2'26 Revenue</div></div><div><div class="comp-bubble-val">+22%</div><div class="comp-bubble-label">Rev YoY</div></div></div></div>
      <div class="comp-bubble"><div class="comp-bubble-name">Rolls-Royce mtu / Wärtsilä</div><div class="comp-bubble-stats"><div><div class="comp-bubble-val">~10%e</div><div class="comp-bubble-label">Combined Share</div></div><div><div class="comp-bubble-val">~$12Be</div><div class="comp-bubble-label">Revenue</div></div><div><div class="comp-bubble-val">+12%e</div><div class="comp-bubble-label">Rev YoY</div></div></div></div>
    </div>
  </div>

  <!-- Construction Industries -->
  <div class="biz-card" style="border-left: 3px solid #3b82f6;">
    <div class="biz-header">
      <div>
        <div class="biz-name">Construction Industries</div>
        <span class="biz-badge dominant" style="margin-top:8px;">~15.2% GLOBAL MARKET SHARE — #1 WORLDWIDE</span>
      </div>
      <div class="biz-stats">
        <div class="biz-stat"><div class="biz-stat-val">$25.1B</div><div class="biz-stat-label">FY25 Revenue</div></div>
        <div class="biz-stat"><div class="biz-stat-val">−1.6%</div><div class="biz-stat-label">FY25 YoY</div></div>
        <div class="biz-stat"><div class="biz-stat-val">~15.2%</div><div class="biz-stat-label">Market Share</div></div>
        <div class="biz-stat"><div class="biz-stat-val">~34%</div><div class="biz-stat-label">Revenue Mix</div></div>
      </div>
    </div>
    <div class="biz-desc">

<!-- ============ SECTION 03: MOAT & VULNERABILITIES ============ -->
<div class="section">
  <div class="section-title"><span class="num">03</span> Competitive Moat &amp; Vulnerabilities</div>
  <div class="moat-list">
    <div class="moat-pill">Global Dealer Network (~156)</div>
    <div class="moat-pill">Installed Base &amp; Aftermarket Parts</div>
    <div class="moat-pill">Brand — "Cat Yellow"</div>
    <div class="moat-pill">Engine &amp; Emissions Certification</div>
    <div class="moat-pill">Manufacturing Scale</div>
    <div class="moat-pill">Captive Financing</div>
    <div class="moat-pill">Capacity Reservation Lock-In</div>
  </div>
  <p class="prose" style="margin-top:20px;">
    Caterpillar's moat is not the machine — it is everything around the machine. Roughly 156 independent dealers, most of them multi-generational family businesses, operate thousands of service locations across nearly 190 countries; a mine in Chile or a contractor in Indonesia buys Cat partly because a technician and a part can reach the site within hours, and downtime on a $6M mining truck costs far more than the price premium. That network sustains a <strong>~$24B services revenue stream</strong> at structurally higher margins than new equipment, and it is close to unreplicable — Chinese entrants can match the steel, not thirty years of dealer capital. The Power &amp; Energy franchise adds a second, newer moat: emissions-certified large engines are slow to design, slower to certify, and capacity is now sold out for years, so hyperscalers are signing gigawatt-scale reservations rather than shopping on price. Backlog at $72.1B (59% shipping within twelve months) is the moat made visible.
  </p>
  <div style="margin-top:28px;">
    <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;">Key Vulnerabilities</div>
    <p class="prose" style="margin-bottom:14px;"><strong>Cyclicality — the oldest problem, now hidden.</strong> Construction and mining capex are among the most cyclical spending lines in the economy, and Caterpillar's operating leverage cuts both ways: FY2025 adjusted EPS fell 13% to $19.06 on a mere volume dip plus tariffs. The record backlog masks this, but a backlog is a promise, not a contract in the strict sense — orders placed for 2029–2030 delivery can be deferred if the AI capex cycle cools.</p>
    <p class="prose" style="margin-bottom:14px;"><strong>Chinese competition and export share.</strong> XCMG ($14.2B) has passed Deere to become the world's #3 construction-equipment maker and Sany is close behind; both compete aggressively on price across Asia, Africa, Latin America and the Middle East — markets where the dealer-network premium is thinnest. Caterpillar has already ceded meaningful share in China itself, and each cycle of Chinese overcapacity exports deflation into Caterpillar's non-U.S. pricing.</p>
    <p class="prose" style="margin-bottom:14px;"><strong>Data-center concentration and permitting backlash.</strong> The segment carrying the valuation is exposed to a small number of hyperscaler customers and to a policy environment turning hostile: New York enacted a data-center moratorium, Texas froze new project approvals pending a state audit in August 2026, and water, zoning and tax-incentive fights are spreading. Baird's July 29 downgrade explicitly cited this as a multiple-compression risk, and the stock fell ~7% that day. Concentration risk plus regulatory risk in the same revenue line is a genuinely poor combination.</p>
    <p class="prose"><strong>Technology disruption and trade policy.</strong> Two slower-burning threats sit under the moat. First, electrification and autonomy are re-opening a product category that has been closed for decades: battery-electric compact machines invite new entrants who do not need Caterpillar's engine expertise, and autonomous haulage shifts value from iron toward software and fleet-management platforms where Komatsu, Epiroc and pure-play technology vendors compete on different terms. Caterpillar leads today with Cat MineStar and a large autonomous fleet, but leadership in a software category is a very different defensive proposition than leadership in diesel engines. Second, trade policy is an ongoing structural cost: roughly $1.8B of tariffs in 2025 and ~$2.2B guided for 2026 against FY2025 operating profit near $11B. Pricing has recovered part of it ($595M of favorable price realization in Q2 2026 alone), but pass-through depends on a demand environment strong enough to absorb it — and demand environments change faster than tariff schedules.</p>
  </div>
</div>

    <p class="prose"><strong>Notable One-Off Items:</strong> Trailing figures are unusually distorted. <strong>Tariffs</strong> are the dominant item: roughly <strong>$1.8B of cost in 2025</strong> (raised through the year from an initial $1.3–1.5B estimate) and guided at approximately <strong>$2.2B gross in 2026</strong>, partially offset by <strong>$392M of IEEPA</strong> (International Emergency Economic Powers Act) <strong>tariff recoveries booked in Q2 2026</strong> — a genuine one-off, with management explicitly guiding no further recoveries in the second half. Q2 2026's headline 21.9% adjusted operating margin therefore overstates the underlying run-rate by roughly 190bps. <strong>Restructuring</strong> cost $444M in FY2025, of which $319M landed in Q4, including write-downs in the Rail division. Caterpillar also books an annual <strong>Q4 mark-to-market remeasurement of pension and OPEB plans</strong>, which routinely swings fourth-quarter GAAP results by hundreds of millions in either direction and is the main reason GAAP and adjusted EPS diverge most in Q4. Finally, the <strong>segment renaming and re-segmentation</strong> (Energy &amp; Transportation → Power &amp; Energy) restated prior-period segment revenue, so pre-2025 segment comparisons drawn from older filings will not tie.</p>

<!-- ============ SECTION 08: SUMMARY & KEY RISKS ============ -->
<div class="section">
  <div class="section-title"><span class="num">08</span> Summary &amp; Key Risks</div>
  <div class="case-grid">
    <div class="case-card bull">
      <h4>▲ Bull Case</h4>
      <p>Caterpillar has become the physical bottleneck in AI infrastructure: grid interconnection queues run years long, so hyperscalers buy their own power, and large reciprocating engines and turbines are capacity-constrained through 2030. A $72.1B backlog (+92% YoY, 59% shipping within twelve months) plus six separate gigawatt-scale customer agreements gives revenue visibility no machinery company has ever had. Meanwhile the cyclical businesses are inflecting at the same time — Construction +35% and Resource +20% in Q2 — while capacity triples versus 2024 and the whole program is funded from $9B of trailing free cash flow. At 1.64x PEG with 57% ROE and 32 straight years of dividend increases, you are paying a growth multiple for an entrenched franchise with a fortress distribution moat.</p>
    </div>
    <div class="case-card bear">
      <h4>▼ Bear Case</h4>
      <p>You are paying 36.9x trailing and 29.8x forward earnings for a company whose revenue is still 60%+ tied to construction and mining cycles, at a beta of 1.60, after a 108% twelve-month move. The July 2026 drawdown showed how fast this unwinds: one downgrade on <em>permitting policy</em> — not orders, not earnings — took 7% out in a day and 17% out in a month. Data-center backlash is spreading from New York to Texas, roughly $2.2B of annual tariff cost is structural, and the 2027–2029 capacity build commits capital years before the revenue arrives. If AI capex normalizes even modestly, CAT is left with tripled engine capacity, a de-rated multiple, and two cyclical segments facing tough comparisons. The 8-Buy/8-Hold split is the Street saying exactly this.</p>
    </div>
  </div>
  <div style="margin-top:28px;">
    <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Top 3 Risks</div>
    <div class="risk-list">
      <div class="risk-item"><span class="risk-num">01</span><div><strong style="color:var(--text);">AI capex normalization / multiple compression.</strong> The gap between a 36.9x machinery stock and a 15x machinery stock is roughly 60% of the share price. Any credible sign that hyperscaler power procurement is slowing — order deferrals, a hyperscaler capex cut, or simply a cooling AI tape — removes the premium far faster than backlog can be delivered. Beta of 1.60 means the stock now moves with the AI complex, not with housing starts.</div></div>
      <div class="risk-item"><span class="risk-num">02</span><div><strong style="color:var(--text);">Data-center policy and permitting.</strong> New York's moratorium and Texas's August 2026 approval freeze pending a state audit are the leading edge of a nationwide fight over water, grid capacity, zoning and tax incentives. Baird's downgrade thesis is that this compresses the multiple regardless of near-term orders — and the July price action proved the market agrees. Concentration in a handful of hyperscaler customers amplifies it.</div></div>
      <div class="risk-item"><span class="risk-num">03</span><div><strong style="color:var(--text);">Tariffs, trade policy and cost pass-through.</strong> Roughly $1.8B of tariff cost in 2025 and ~$2.2B guided for 2026 against ~$11B of FY2025 operating profit. Q2's margin was flattered by $392M of IEEPA recoveries that management says will not repeat in the second half. Pass-through has worked while demand is red-hot; in a softer order environment the same tariffs would hit margins directly — and further trade escalation, or an adverse legal outcome on tariff refunds, would widen the hit.</div></div>
    </div>
  </div>
</div>

    </div>
    <div class="biz-desc">
      U.S. electricity demand is rising for the first time in roughly two decades, and the constraint is not generation capacity in aggregate — it is <em>time</em>. Utility interconnection queues stretch years, so hyperscalers increasingly build behind-the-meter generation: gas reciprocating engines and turbines sited at the data center. That is Caterpillar's product. Power generation sales-to-users grew <strong style="color:var(--text);">72% in Q2 2026</strong>; large-engine backlog is up more than 3.5x since January 2024; six customer agreements each cover 1 GW or more; and management reports orders being placed as far out as <strong style="color:var(--text);">2030</strong>. Peers confirm the same picture from different angles — GE Vernova's gas turbine backlog hit 116 GW (targeting 125 GW by year-end) with orders +88% organically, and Cummins says its Power Systems business is "selling out into the second half of 2028." This is not a Caterpillar-specific narrative; it is an industry-wide capacity shortage. The analytical caution: an industry-wide shortage invites industry-wide capacity addition, and Caterpillar, Cummins, GE Vernova, Mitsubishi and Wärtsilä are all expanding at once into a demand curve nobody can forecast past 2028.
    </div>
  </div>
  <div class="biz-card" style="border-left:3px solid var(--amber);">
    <div class="biz-header">
      <div class="biz-name">Tariffs: A $2B+ Annual Tax on a Globally-Sourced Manufacturer</div>
      <span class="biz-badge" style="background:var(--amber-dim);color:var(--amber);">ONGOING HEADWIND</span>
    </div>
    <div class="biz-desc">
      Caterpillar builds in the U.S., Europe, Japan, China, India, Brazil and Mexico, and moves components across all of them — which makes it one of the most tariff-exposed large-cap industrials in America. The 2025 hit escalated through the year from an initial $1.3–1.5B estimate to roughly <strong style="color:var(--text);">$1.8B</strong>, and drove the $1.03B of unfavorable manufacturing costs that crushed Q4 2025 margins (13.9% GAAP operating margin, down from 18.0%). For 2026, guidance is approximately <strong style="color:var(--text);">$2.2B gross</strong> — trimmed from $2.5B — with <strong style="color:var(--text);">$392M of IEEPA recoveries</strong> booked in Q2 and none expected in the second half. Section 232 duties on construction equipment and parts, at rates up to 50%, sit on top of that. Pricing has offset a meaningful share ($595M of favorable price realization in Q2 2026), and adjusted operating margin still expanded 430bps — but that only works while the order book is this strong. The honest read: tariffs are currently a manageable, disclosed, quantified headwind; in a demand downturn they become an unhedged margin problem.
    </div>
  </div>
  <div class="biz-card" style="border-left:3px solid #3b82f6;">
    <div class="biz-header">
      <div class="biz-name">The Old Cycle Is Turning Too — and That Is the Real Bull/Bear Divide</div>
      <span class="biz-badge" style="background:var(--blue-dim);color:var(--blue);">CYCLICAL INFLECTION — FRAMES THE DEBATE</span>
    </div>
    <div class="biz-desc">
      Lost in the AI story: the traditional businesses are inflecting simultaneously. Global construction equipment hit a record $246.6B in 2025 (+3.8%), North American Construction Industries sales rose 50% to $5.1B in Q2 2026, and Resource Industries grew 20% as mining fleets bought in the 2011–2013 supercycle finally age out against copper and critical-minerals demand. Infrastructure spending and data-center site work are reinforcing each other — every gigawatt of compute needs earthmoving before it needs engines. <strong style="color:var(--text);">The frame for investors:</strong> the bull argues you are getting a cyclical recovery and a secular power franchise at the same time, with a $72B backlog, 18.3% ROIC and 32 years of dividend growth underwriting the wait. The bear argues you are buying two peaks at once — a construction cycle that has already run six quarters and an AI capex cycle whose first policy speed bump cost the stock 17% in a month — at 30x forward earnings and a 1.60 beta. Both are describing the same $393B company. The difference is not the analysis of Caterpillar; it is what you assume about hyperscaler capital spending in 2028, and that assumption, not the stock selection, is the actual wager.

// Simple moving average on monthly data (window in months)
function sma(data, window) {
  return data.map((_, i) => {
    if (i < window - 1) return null;
    let sum = 0;
    for (let j = i - window + 1; j <= i; j++) sum += data[j];
    return +(sum / window).toFixed(2);
  });
}

// 6-period RSI (Wilder smoothing) on monthly closes
function computeRSI(data, period) {
  const rsi = new Array(data.length).fill(null);
  let gain = 0, loss = 0;
  for (let i = 1; i <= period; i++) {
    const d = data[i] - data[i - 1];
    if (d >= 0) gain += d; else loss -= d;
  }
  let avgGain = gain / period, avgLoss = loss / period;
  rsi[period] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  for (let i = period + 1; i < data.length; i++) {
    const d = data[i] - data[i - 1];
    const g = d > 0 ? d : 0, l = d < 0 ? -d : 0;
    avgGain = (avgGain * (period - 1) + g) / period;
    avgLoss = (avgLoss * (period - 1) + l) / period;
    rsi[i] = avgLoss === 0 ? 100 : +(100 - 100 / (1 + avgGain / avgLoss)).toFixed(1);
  }
  return rsi;
}
