<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Viewer — The Tilted Gent</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-b-monogram.svg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0D0F14;--line:#262B36;--cream:#EFE7D2;--gold:#C9A227;--red:#D7263D;--dim:#8A8F9C;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--cream);font-family:'DM Sans',Arial,sans-serif;display:flex;flex-direction:column;}
  a{color:inherit;text-decoration:none;}
  nav{flex:0 0 auto;background:rgba(13,15,20,.94);border-bottom:1px solid var(--line);}
  .navrow{max-width:1120px;margin:0 auto;padding:11px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .navbrand{display:flex;align-items:center;gap:10px;}
  .navbrand img{width:32px;height:32px;display:block;}
  .navword{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:17px;letter-spacing:1px;white-space:nowrap;}
  .navword em{color:var(--red);}
  .navlinks{display:flex;gap:22px;font-size:13.5px;font-weight:500;color:var(--dim);align-items:center;}
  .navlinks a:hover{color:var(--cream);}
  .navlinks .active{color:var(--gold);}
  @media(max-width:720px){.navrow{padding:10px 14px;}.navlinks{gap:14px;font-size:12.5px;}.hide-sm{display:none;}}
  .subbar{flex:0 0 auto;background:#14171F;border-bottom:1px solid var(--line);}
  .subrow{max-width:1120px;margin:0 auto;padding:7px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:2px;color:var(--dim);}
  .subrow .tick{color:var(--gold);font-weight:700;}
  .subrow a:hover{color:var(--cream);}
  @media(max-width:720px){.subrow{padding:7px 14px;}}
  main{flex:1 1 auto;min-height:0;}
  iframe{display:block;width:100%;height:100%;border:0;background:#0a0e18;}
  .missing{max-width:640px;margin:80px auto;padding:0 28px;text-align:center;color:var(--dim);}
  .missing h1{font-family:'Playfair Display',Georgia,serif;color:var(--cream);font-size:28px;margin-bottom:12px;}
  .missing a{color:var(--gold);}
</style>
</head>
<body>

<nav>
  <div class="navrow">
    <a class="navbrand" href="../">
      <img src="../assets/logo-b-monogram.svg" alt="The Tilted Gent monogram">
      <span class="navword">THE <em>TILTED</em> GENT</span>
    </a>
    <div class="navlinks">
      <a href="../">Home</a>
      <a class="hide-sm" href="../#learn">Learn</a>
      <a class="hide-sm" href="../#degens">Le Degens</a>
      <a class="hide-sm" href="../#tools">Toolbox</a>
      <a class="active" href="./">Reports</a>
    </div>
  </div>
</nav>

<div class="subbar">
  <div class="subrow">
    <span id="crumb"><span class="tick">—</span></span>
    <a href="./">&larr; ALL REPORTS</a>
  </div>
</div>

<main id="main"></main>

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var r = (params.get('r') || '').toLowerCase();
  var main = document.getElementById('main');
  var crumb = document.getElementById('crumb');
  if(/^[a-z0-9]{1,6}$/.test(r)){
    var t = r.toUpperCase();
    document.title = t + ' Report — The Tilted Gent';
    crumb.innerHTML = 'TEAR-SHEET &middot; <span class="tick">' + t + '</span>';
    var f = document.createElement('iframe');
    f.src = r + '_analysis.html';
    f.title = t + ' analysis report';
    f.onload = function(){
      try {
        var d = f.contentDocument;
        var innerNav = d.getElementById('tg-sitenav');
        if (innerNav) innerNav.remove();
        document.title = d.title + ' — The Tilted Gent';
      } catch(e){}
    };
    main.appendChild(f);
  } else {
    crumb.innerHTML = 'TEAR-SHEET &middot; <span class="tick">?</span>';
    main.innerHTML = '<div class="missing"><h1>No report selected</h1><p>That link didn\'t point at a ticker we know. Head back to <a href="./">the reports table</a> and pick a seat.</p></div>';
  }
})();
</script>

</body>
</html>
