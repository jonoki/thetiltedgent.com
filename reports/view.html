<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>document.documentElement.classList.add('js');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06050B">
<meta name="color-scheme" content="dark">
<title>Report Viewer — The Tilted Gent</title>
<link rel="icon" type="image/svg+xml" href="../assets/ttg-favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
   /* palette: Fremont Street (assets/palettes/fremont-street.css) */
  
  html,body{height:100%;}
  body{background:var(--bg);color:var(--cream);font-family:'DM Sans',Arial,sans-serif;display:flex;flex-direction:column;}
  
  a:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;}

  @media(max-width:720px){.hide-sm{display:none;}}
  .subbar{flex:0 0 auto;background:var(--bg2);border-bottom:1px solid var(--line);}
  .subrow{max-width:1120px;margin:0 auto;padding:7px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--dim);}
  .subrow .tick{color:var(--gold);font-weight:700;}
  .subrow a:hover{color:var(--cream);}
  @media(max-width:720px){.subrow{padding:7px 14px;}}
  main{flex:1 1 auto;min-height:0;}
  iframe{display:block;width:100%;height:100%;border:0;background:#0a0e18;}
  .missing{max-width:640px;margin:80px auto;padding:0 28px;text-align:center;color:var(--dim);}
  .missing h1{font-family:'Cinzel',Georgia,serif;color:var(--cream);font-size:26px;margin-bottom:12px;}
  .missing a{color:var(--gold);}
</style>
</head>
<body>

<nav class="site" aria-label="Site">
  <div class="wrap navrow">
    <a class="navbrand" href="/">
      <img src="/assets/ttg-mark-neon.svg" alt="" width="46" height="46">
      <span class="navword">THE <span class="tilt">TILTED</span> GENT</span>
    </a>
    <button class="navtoggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="navmenu"><span class="bars"></span></button>
    <div class="navlinks" id="navmenu">
      <a href="/#learn">Learn</a>
      <a href="/tables/casino-games.html">The Tables</a>
      <a href="/#degens">Le Degens</a>
      <a href="/#tools">The Toolbox</a>
      <a href="/reports/" aria-current="page">Reports</a>
      <a href="/#about">The Gent</a>
      <a class="cta" href="/#learn">Take a Seat</a>
    </div>
  </div>
</nav>

<div class="subbar">
  <div class="subrow">
    <span id="crumb"><span class="tick">—</span></span>
    <a href="./">&larr; ALL REPORTS</a>
  </div>
</div>

<main id="main"></main>

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var r = (params.get('r') || '').toLowerCase();
  var moved = {fi: 'fisv'};   // renamed tickers: old links keep working (Fiserv, Nov 2025)
  if (moved[r]) r = moved[r];
  var main = document.getElementById('main');
  var crumb = document.getElementById('crumb');
  // stock reports sit at the root of reports/; ETF, crypto and bond reports in a family folder (r=etf/voo)
  var m = /^(?:(etf|crypto|fixed)\/)?([a-z0-9]{1,8})$/.exec(r);
  if(m && m[1]){ var back = document.querySelector('.subrow a'); if(back) back.href = './?f=' + m[1]; }
  if(m){
    var t = m[2].toUpperCase();
    document.title = t + ' Report — The Tilted Gent';
    crumb.innerHTML = 'TEAR-SHEET &middot; <span class="tick">' + t + '</span>';
    var f = document.createElement('iframe');
    f.src = r + '_analysis.html';
    f.title = t + ' analysis report';
    f.onload = function(){
      try {
        var d = f.contentDocument;
        var innerNav = d.getElementById('tg-sitenav');
        if (innerNav) innerNav.remove();
        document.title = d.title + ' — The Tilted Gent';
      } catch(e){}
    };
    main.appendChild(f);
  } else {
    crumb.innerHTML = 'TEAR-SHEET &middot; <span class="tick">?</span>';
    main.innerHTML = '<div class="missing"><h1>No report selected</h1><p>That link didn\'t point at a ticker we know. Head back to <a href="./">the reports table</a> and pick a seat.</p></div>';
  }
})();
</script>

<script src="/assets/site.js" defer></script>
</body>
</html>
